name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: |
            go.sum
            lib/jobruntime/go.sum
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@v1

      - name: Quality gates
        run: task ci:checks

  docker:
    name: Docker build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: rex-notification-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
